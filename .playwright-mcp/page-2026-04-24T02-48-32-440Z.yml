              - paragraph [ref=e86]: 본루와 익루(요선각), 월랑으로 구성된 건축물은 조선 후기 목조건축의 특징인 화려한 장식과 함께 익루의 온돌, 월랑의 계단 등 실용적 요소가 결합돼 있다. 앞서 2023년에 한 차례 국보 승격을 추진했으나 당시 광한루를 이루는 누각과 익루의 건축 시기와 양식이 동일한지 명확하지 않다는 이유로 ‘보류’ 결정이 났다. 이에 남원시에선 두 누각을 구성하는 기둥 등의 나이테를 분석해 1626년에 함께 중건된 사실을 규명했다.
