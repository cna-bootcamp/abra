              - paragraph [ref=e77]: 춘향과 이몽룡의 사랑이 시작된 전북 남원 광한루(사진)가 국보로 지정된다.
              - paragraph [ref=e78]: 24일 국가유산청은 남원 광한루를 국가지정문화유산 국보로 지정 예고한다고 밝혔다. 1963년 보물로 지정된 지 약 63년 만이다.
              - paragraph [ref=e79]: 광한루는 조선 후기 호남지역을 대표하는 누각 건물로 ‘호남제일루(湖南第一樓)’라 불리기도 했다. 관리들이 각종 연회를 열었던 장소로, 조선 초기 황희(1363∼1452)가 남원으로 유배를 와 세운 광통루가 기원으로 알려져 있다. 1597년 정유재란으로 당시 건물이 소실됐으나 1626년 인조 때 지금과 같은 규모로 중건했다.
