# 에이전트가 필요로 하는 도구 선언
# 런타임이 Gateway의 runtime-mapping.yaml을 참조하여 실제 도구에 매핑
#
# 주의: Dify DSL/Workflow 관리 도구는 prototype-runner 소속.
# frontend-developer는 SPA 코드 + 빌드 검증 + 백엔드 통합 패치 전문이므로
# 파일 I/O + 코드 실행 + 검색/진단만 사용.
tools:
  - name: file_read
    description: "파일 내용 읽기"
    input: { 파일경로 }
    output: { 파일내용 }

  - name: file_write
    description: "파일 생성·수정 (frontend/, app/main.py 패치, deploy/Dockerfile 패치, .gitignore)"
    input: { 파일경로, 내용 }
    output: { 성공여부 }

  - name: code_execute
    description: |
      코드·명령 실행.
      주요 사용처:
        - npm install, npm run build (frontend 빌드)
        - cp -r frontend/dist static/ (정적 산출물 복사)
        - uv run uvicorn app.main:app --port 8000 (검증용 백엔드 기동)
        - python {ABRA_PLUGIN_DIR}/gateway/tools/generate_image.py (이미지 자동 생성)
        - urllib.request.urlopen 기반 HTTP 검증 스크립트
        - Windows 포트 점유 정리 (PowerShell Stop-Process)
    input: { 명령어 }
    output: { 실행결과, 에러정보, exit_code }

  - name: code_search
    description: "코드베이스에서 패턴 검색 (백엔드 라우트·환경변수 키 추출, 기존 컴포넌트 패턴 파악)"
    input: { 검색패턴, 검색범위 }
    output: { 매칭결과목록 }

  - name: code_diagnostics
    description: "파일의 오류·경고 조회 (Vite/TS 타입체커·ESLint 통합)"
    input: { 파일경로 }
    output: { 에러목록, 경고목록 }
